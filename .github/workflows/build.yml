name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [camunda, cibseven]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and verify (engine=${{ matrix.engine }})
        run: ./mvnw -B verify -Dtokennudge.it.engine=${{ matrix.engine }}
